<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Muse Build Day Starter</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; margin-bottom: .25rem; }
  .muted { opacity: .65; font-size: .9rem; }
  textarea, input, select, button { font: inherit; width: 100%; box-sizing: border-box; margin: .3rem 0; padding: .55rem; border-radius: 8px; border: 1px solid #8886; }
  button { cursor: pointer; background: #0866ff; color: #fff; border: none; font-weight: 600; }
  button:disabled { opacity: .5; }
  #out { white-space: pre-wrap; border: 1px solid #8886; border-radius: 8px; padding: 1rem; min-height: 6rem; margin-top: .8rem; }
  img#preview { max-width: 200px; border-radius: 8px; display: none; margin-top: .3rem; }
  .row { display: flex; gap: .5rem; } .row > * { flex: 1; }
</style>
</head>
<body>
  <h1>Muse Build Day Starter</h1>
  <p class="muted">FastAPI + OpenRouter. API docs at <a href="/docs">/docs</a>.</p>

  <div class="row">
    <select id="model"><option value="">default model</option></select>
    <input id="system" placeholder="System prompt (optional)" />
  </div>
  <textarea id="prompt" rows="4" placeholder="Ask Muse anything..."></textarea>
  <input id="file" type="file" accept="image/*" />
  <img id="preview" alt="" />
  <button id="send">Send (streaming)</button>
  <div id="out"></div>
  <p class="muted" id="meta"></p>

<script>
const $ = (id) => document.getElementById(id);
let imageDataUrl = null;

fetch("/api/models").then(r => r.ok ? r.json() : []).then(models => {
  for (const m of models) { const o = document.createElement("option"); o.value = m.id; o.textContent = m.id; $("model").appendChild(o); }
}).catch(() => {});

$("file").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) { imageDataUrl = null; $("preview").style.display = "none"; return; }
  const reader = new FileReader();
  reader.onload = () => { imageDataUrl = reader.result; $("preview").src = imageDataUrl; $("preview").style.display = "block"; };
  reader.readAsDataURL(f);
});

$("send").addEventListener("click", async () => {
  const content = $("prompt").value.trim(); if (!content && !imageDataUrl) return;
  $("send").disabled = true; $("out").textContent = ""; $("meta").textContent = "";
  const t0 = performance.now();
  const body = {
    messages: [{ role: "user", content, image_urls: imageDataUrl ? [imageDataUrl] : [] }],
    system: $("system").value || null,
    model: $("model").value || null,
  };
  try {
    const res = await fetch("/api/chat/stream", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) { $("out").textContent = await res.text(); return; }
    const reader = res.body.getReader(); const dec = new TextDecoder();
    while (true) { const { done, value } = await reader.read(); if (done) break; $("out").textContent += dec.decode(value, { stream: true }); }
    $("meta").textContent = `${((performance.now() - t0) / 1000).toFixed(1)}s`;
  } catch (err) { $("out").textContent = String(err); }
  finally { $("send").disabled = false; }
});
</script>
</body>
</html>
